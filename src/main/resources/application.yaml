spring:
  application:
    name: frotaPro
  cache:
    type: simple

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  kafka:
    consumer:
      group-id: frota-pro-api-v2
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # Um job de sync pode responder com centenas de cargas de uma vez e
      # passar do 1MB padrão do Kafka (RecordTooLargeException lá na
      # integradora, que é quem produz essa mensagem) — sobe o limite de
      # fetch aqui pra bater com o max.request.size maior do produtor. Precisa
      # bater também com o message.max.bytes do broker/tópico em produção.
      properties:
        spring.json.trusted.packages: "br.com.frotasPro.api.integracao.dto,br.com.frotasPro.integradora.winthor.dto"
        spring.json.use.type.headers: false
        max.partition.fetch.bytes: 10485760
        fetch.max.bytes: 10485760

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.request.size: 10485760

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

server:
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always


logging:
  file:
    name: logs/frotapro.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

frotapro:
  empresa-sync-id: 11111111-2222-3333-4444-555555555555

  integracao:
    integradora-base-url: ${INTEGRADORA_BASE_URL:http://localhost:8081}
    # Segredo que a integradora exige (cabeçalho X-Integradora-Token). Mesmo valor nos dois lados.
    integradora-token: ${INTEGRADORA_API_TOKEN:}
    timeout-ms: 2000
    nfe:
      timeout-ms: 8000

  resend:
    api-key: ${RESEND_API_KEY:}
    remetente: ${RESEND_FROM_EMAIL:}

  logs:
    api-file: logs/frotapro.log
    integradora-logfile-path: /actuator/logfile

  kafka:
    topics:
      carga-sync-request: frotapro.carga.sync.request
      carga-sync-response: frotapro.carga.sync.response
      motorista-sync-request: frotapro.motorista.sync.request
      motorista-sync-response: frotapro.motorista.sync.response
      caminhao-sync-request: frotapro.caminhao.sync.request
      caminhao-sync-response: frotapro.caminhao.sync.response

  # BI do gerente (Metabase). Sem BI_EMBEDDING_SECRET o recurso fica desligado (503).
  bi:
    metabase-site-url: ${BI_METABASE_URL:}
    metabase-api-url: ${BI_METABASE_API_URL:}
    embedding-secret: ${BI_EMBEDDING_SECRET:}
    token-ttl-minutos: 30
    dashboards:
      - { id: 2, titulo: "Operação, combustível e custos", descricao: "Visão geral: cargas, combustível, custo por km, metas e rankings", categoria: "Visão geral", icone: painel }
      - { id: 4, titulo: "Postos e preço do diesel", descricao: "Preço médio do litro, ranking de postos e economia possível", categoria: "Combustível e custos", icone: combustivel }
      - { id: 6, titulo: "Clientes e custo do frete", descricao: "Valor transportado, notas por cidade e custo por rota", categoria: "Combustível e custos", icone: dinheiro }
      - { id: 5, titulo: "Ocupação e tempo de viagem", descricao: "Ocupação da capacidade, duração das viagens e cargas em rota", categoria: "Frota e viagens", icone: caminhao }
      - { id: 12, titulo: "Previsto × realizado nas rotas", descricao: "Pontualidade das viagens por motorista e por rota", categoria: "Frota e viagens", icone: relogio }
      - { id: 10, titulo: "Manutenção, pneus e custo total", descricao: "Gasto com manutenção, pneus e custo total por caminhão", categoria: "Manutenção e documentos", icone: manutencao }
      - { id: 9, titulo: "Vencimentos", descricao: "Documentos e preventivas vencidos ou a vencer", categoria: "Manutenção e documentos", icone: agenda }
      - { id: 11, titulo: "Multas", descricao: "Multas, pontos na CNH e valores em aberto", categoria: "Manutenção e documentos", icone: multa }
      - { id: 3, titulo: "Erros para corrigir", descricao: "Lançamentos com valores absurdos, duplicados ou incompletos", categoria: "Qualidade dos dados", icone: regra }
      - { id: 8, titulo: "Implantação dos módulos", descricao: "Quanto cada módulo já está sendo lançado", categoria: "Qualidade dos dados", icone: lista, somenteAdmin: true }
      - { id: 7, titulo: "Integração Winthor e saúde do sistema", descricao: "Sincronização, auditoria, uso e segurança", categoria: "Qualidade dos dados", icone: sync, somenteAdmin: true }

  storage:
    upload-dir: ./data/uploads
  security:
    cors:
      allowed-origins:
        - "*"
        - http://localhost:*
        - http://127.0.0.1:*
    prometheus-permit-all: false
    # proxies cujo X-Forwarded-For vale, em CIDR separados por vírgula. Vazio = faixas privadas e loopback.
    trusted-proxies: ${TRUSTED_PROXIES:}
    jwt:
      access-token-seconds: 900
      refresh-token-seconds: 604800
    login:
      rate-limit:
        ip:
          max-attempts: 30
          window-seconds: 60
        user:
          max-attempts: 12
          window-seconds: 60
      block:
        first-threshold: 5
        first-seconds: 300
        second-threshold: 8
        second-seconds: 900
        third-threshold: 10
        third-seconds: 1800


jwt:
  public:
    key: ${JWT_PUBLIC_KEY}
  private:
    key: ${JWT_PRIVATE_KEY}
