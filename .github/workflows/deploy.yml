name: Build and Deploy API

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, vps10364]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build image
        run: docker build -t arthenyo/frotapro-api:latest .

      - name: Push image
        run: docker push arthenyo/frotapro-api:latest

      - name: Deploy locally
        run: |
          cd /opt/apps/frotapro-prod
          docker compose --env-file /opt/env/frotapro-prod/.env.prod pull frotapro-api
          docker compose --env-file /opt/env/frotapro-prod/.env.prod up -d --no-deps --remove-orphans frotapro-api
          docker compose logs --tail=200 frotapro-api
